services:
  - type: web
    name: quicklifenow-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: QuickLifeNow
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: cookie
      - key: QUEUE_CONNECTION
        value: sync
      - key: APP_KEY
        generateValue: true
      - key: RUN_SEEDER
        value: "true"
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: quicklifenow-db
          property: connectionString
      - key: DB_URL
        fromDatabase:
          name: quicklifenow-db
          property: connectionString

databases:
  - name: quicklifenow-db
    databaseName: quicklifenow
    user: quicklife_user
    plan: free
    region: oregon
